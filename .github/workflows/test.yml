name: test

on:
  push:
    branches: [main, feature/v0.1-foundation, feature/v0.1-autopilot-voc001]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src render.py prepare.py
      - name: Validate fixture
        run: python render.py VOC-001 --validate-only
      - name: Test creative preparation without network
        run: python prepare.py VOC-001 --no-tts --no-download
      - name: Test
        run: pytest -q
      - name: Hardcode audit
        run: '! grep -RniE "teclado|79[,\.]?90|10 metros" src'
