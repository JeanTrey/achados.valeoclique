name: test-and-storyboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      product_id:
        description: Product ID to direct
        required: true
        default: VOC-003
        type: string
      render_approved:
        description: Render MP4 after storyboard review
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src render.py prepare.py make_storyboard.py analyze_benchmarks.py collect_benchmarks.py
      - name: Validate fixtures
        run: |
          python render.py VOC-001 --validate-only
          python render.py VOC-002 --validate-only
          python render.py VOC-003 --validate-only
      - name: Test creative preparation without network
        run: python prepare.py VOC-001 --no-tts --no-download
      - name: Test
        run: pytest -q
      - name: Hardcode audit
        run: '! grep -RniE "teclado|79[,\.]?90|10 metros" src'

  creative:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCT_ID: ${{ github.event.inputs.product_id || 'VOC-003' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover public benchmark candidates
        run: python collect_benchmarks.py --target 80
      - name: Analyse up to 50 real benchmark videos
        continue-on-error: true
        run: python analyze_benchmarks.py --max 50 --workers 6
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: |
            benchmarks/candidate_urls.json
            benchmarks/generated_records.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build creative plan and storyboard
        run: python make_storyboard.py "$PRODUCT_ID"
      - name: Upload storyboard for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_ID }}-storyboard
          path: |
            products/${{ env.PRODUCT_ID }}/creative_plan.json
            products/${{ env.PRODUCT_ID }}/storyboard/
            products/${{ env.PRODUCT_ID }}/images/derived/
            memory/benchmark_profile.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare approved video assets and audio
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved == true
        run: python prepare.py "$PRODUCT_ID"
      - name: Render approved MP4
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved == true
        run: python render.py "$PRODUCT_ID"
      - name: Validate approved MP4
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved == true
        run: |
          test -s "output/${PRODUCT_ID}.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -of default=noprint_wrappers=1 "output/${PRODUCT_ID}.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 "output/${PRODUCT_ID}.mp4"
      - name: Upload approved video
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_ID }}-mp4
          path: output/${{ env.PRODUCT_ID }}.mp4
          if-no-files-found: error
          retention-days: 14
