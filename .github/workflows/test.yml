name: test-and-render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      product_id:
        description: Product ID to render
        required: true
        default: VOC-002
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src render.py prepare.py analyze_benchmarks.py
      - name: Validate fixtures
        run: |
          python render.py VOC-001 --validate-only
          python render.py VOC-002 --validate-only
      - name: Test creative preparation without network
        run: python prepare.py VOC-001 --no-tts --no-download
      - name: Test
        run: pytest -q
      - name: Hardcode audit
        run: '! grep -RniE "teclado|79[,\.]?90|10 metros" src'

  render:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      PRODUCT_ID: ${{ github.event.inputs.product_id || 'VOC-002' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare benchmark profile, product assets, narration, music and SFX
        run: python prepare.py "$PRODUCT_ID"
      - name: Upload creative diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_ID }}-diagnostics
          path: |
            products/${{ env.PRODUCT_ID }}/script.json
            memory/benchmark_profile.json
          if-no-files-found: warn
          retention-days: 14
      - name: Render MP4
        run: python render.py "$PRODUCT_ID"
      - name: Validate rendered MP4
        run: |
          test -s "output/${PRODUCT_ID}.mp4"
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 "output/${PRODUCT_ID}.mp4"
          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 "output/${PRODUCT_ID}.mp4"
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_ID }}-mp4
          path: output/${{ env.PRODUCT_ID }}.mp4
          if-no-files-found: error
          retention-days: 14
